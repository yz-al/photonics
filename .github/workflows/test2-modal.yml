name: Test 2 (optics-native architecture) on Modal GPU

# Launches the Test-2 training sweep on a Modal GPU and commits the results
# JSON back to this branch. Requires two repository secrets:
#   MODAL_TOKEN_ID, MODAL_TOKEN_SECRET
# Triggers on a push that touches test2/** (excluding the results it writes back),
# or manually via the Actions tab.

on:
  workflow_dispatch:        # manual / API trigger only, to avoid a GPU run on
                            # every doc/results commit. Re-run from the Actions
                            # tab or via the API when you want a fresh sweep.
    inputs:
      only:
        description: 'Run only a block (e.g. "cnn" for the CIFAR-10 CNN); empty = full sweep'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: test2-modal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-modal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal client
        run: pip install "modal==1.5.3"

      - name: Run Test 2 on Modal GPU
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TEST2_ONLY: ${{ inputs.only }}
        run: |
          # Prefer repo Actions secrets; fall back to the committed credentials file.
          if [ -z "$MODAL_TOKEN_ID" ] && [ -f test2/modal_tokens.secret ]; then
            set -a; . ./test2/modal_tokens.secret; set +a
          fi
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::No Modal credentials (neither secrets nor test2/modal_tokens.secret)."
            exit 1
          fi
          modal run test2/modal_app.py

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test2-results
          path: test2/results/*.json
          if-no-files-found: warn

      - name: Commit results back to branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Robust to the branch having moved while the GPU job ran: stash the
          # generated results, re-sync to the latest remote tip, re-apply them.
          mkdir -p /tmp/res && cp test2/results/*.json /tmp/res/ 2>/dev/null || true
          git fetch origin ${{ github.ref_name }}
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
          mkdir -p test2/results
          cp /tmp/res/*.json test2/results/ 2>/dev/null || true
          git add test2/results/*.json
          if git diff --cached --quiet; then
            echo "no results change to commit"
          else
            git commit -m "Test 2: Modal GPU results [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
